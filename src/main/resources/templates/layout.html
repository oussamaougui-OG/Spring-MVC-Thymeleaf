<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Gestion des produits</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark px-3">
    <a class="navbar-brand" th:href="@{/index}">Gestion des produits</a>
    <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" th:href="@{/index}">Liste</a></li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a class="nav-link" th:href="@{/formProducts}">Nouveau</a>
        </li>
    </ul>
    <div class="d-flex align-items-center text-white" sec:authorize="isAuthenticated()">
        <span class="me-3">
            <span sec:authentication="name"></span>
        </span>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button class="btn btn-outline-light btn-sm">Déconnexion</button>
        </form>
    </div>
</nav>
<div class="container mt-4" layout:fragment="content"></div>
</body>
</html>
